name: Publish Microsoft Forms signatures

on:
  push:
    branches:
      - main

  repository_dispatch:
    types:
      - add_signatories

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lsf-signatures-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add submitted signatories
        if: github.event_name == 'repository_dispatch'
        run: |
          python3 <<'PY'
          import html
          import json
          import os
          import pathlib
          import re
          import unicodedata

          path = pathlib.Path("signatories.md")
          marker = "<!-- AUTO-SIGNATORIES -->"

          event_path = pathlib.Path(os.environ["GITHUB_EVENT_PATH"])
          event = json.loads(event_path.read_text(encoding="utf-8"))

          payload = event.get("client_payload", {})

          # Accept either:
          #
          # 1. A single signatory sent directly:
          #    {
          #      "first_name": "Biggles",
          #      "last_name": "Wick",
          #      ...
          #    }
          #
          # 2. A batch:
          #    {
          #      "signatories": [
          #        {...},
          #        {...}
          #      ]
          #    }

          if isinstance(payload, dict) and "signatories" in payload:
              entries = payload.get("signatories", [])

              if isinstance(entries, dict):
                  entries = [entries]

          elif isinstance(payload, dict) and any(
              key in payload
              for key in (
                  "first_name",
                  "last_name",
                  "name",
                  "position",
                  "institution",
                  "country",
              )
          ):
              entries = [payload]

          else:
              entries = []

          if not isinstance(entries, list):
              raise SystemExit(
                  "The supplied signatory payload is not a valid object or array."
              )

          def clean(value, maximum):
              """Return safe, single-line text for public display."""

              value = "" if value is None else str(value)
              value = unicodedata.normalize("NFKC", value)

              value = (
                  value
                  .replace("\r", " ")
                  .replace("\n", " ")
                  .replace("\t", " ")
              )

              value = "".join(
                  character
                  for character in value
                  if character.isprintable()
              )

              value = re.sub(r"\s+", " ", value).strip()
              value = value[:maximum]

              # Prevent submitted HTML from being rendered.
              value = html.escape(value, quote=False)

              # Escape common Markdown formatting characters.
              value = re.sub(
                  r"([\\`*_{}\[\]()#+!|>])",
                  r"\\\1",
                  value,
              )

              return value

          text = path.read_text(encoding="utf-8")

          if marker not in text:
              raise SystemExit(
                  f"Could not find {marker!r} in signatories.md."
              )

          new_records = []

          for entry in entries:
              if not isinstance(entry, dict):
                  print("Skipped a payload entry that was not an object.")
                  continue

              raw_public_text = " ".join(
                  str(entry.get(field, ""))
                  for field in (
                      "first_name",
                      "last_name",
                      "name",
                      "position",
                      "institution",
                      "country",
                  )
              )

              # Do not publish submitted links.
              if re.search(
                  r"(https?://|www\.|mailto:)",
                  raw_public_text,
                  flags=re.IGNORECASE,
              ):
                  print("Skipped an entry containing a web address.")
                  continue

              first_name = clean(entry.get("first_name"), 100)
              last_name = clean(entry.get("last_name"), 100)

              name = " ".join(
                  part
                  for part in (first_name, last_name)
                  if part
              )

              # Retain compatibility with an older single-name payload.
              if not name:
                  name = clean(entry.get("name"), 200)

              position = clean(entry.get("position"), 200)
              institution = clean(entry.get("institution"), 250)
              country = clean(entry.get("country"), 100)

              if not name:
                  print("Skipped an entry with no name.")
                  continue

              parts = [
                  name,
                  position,
                  institution,
                  country,
              ]

              line = ", ".join(
                  part
                  for part in parts
                  if part
              )

              visible_record = f"{line}<br>"

              # Prevent an identical public entry from being added twice.
              if visible_record in text:
                  print(f"Skipped duplicate visible entry: {line}")
                  continue

              if visible_record in new_records:
                  print(f"Skipped duplicate entry within this batch: {line}")
                  continue

              new_records.append(visible_record)

          if new_records:
              insertion = "\n".join(new_records) + "\n"

              text = text.replace(
                  marker,
                  insertion + marker,
                  1,
              )

              path.write_text(
                  text,
                  encoding="utf-8",
              )

              print(f"Added {len(new_records)} signatories.")

          else:
              print("No new signatories to add.")
          PY

      - name: Commit signatory changes
        if: github.event_name == 'repository_dispatch'
        run: |
          if git diff --quiet; then
            echo "No repository change required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add signatories.md
          git commit -m "Publish Microsoft Forms signatures"

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build website with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
